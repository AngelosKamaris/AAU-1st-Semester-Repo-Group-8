e data the prover will store.<br /><br /><b>First implementation:<br /></b><br />Compute the results of the previous functionand their answer, sort them and add them in a table.</div></div></foreignObject><text x="69" y="89" fill="#000000" text-anchor="middle" font-size="12px" font-family="Helvetica">[Not supported by viewer]</text></switch></g><rect x="330" y="90" width="140" height="200" fill="none" stroke="none" pointer-events="all"/><g transform="translate(331.5,96.5)"><switch><foreignObject style="overflow:visible;" pointer-events="all" width="138" height="180" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; font-size: 12px; font-family: Helvetica; color: rgb(0, 0, 0); line-height: 1.2; vertical-align: top; width: 138px; white-space: nowrap; overflow-wrap: normal; text-align: left;"><div xmlns="http://www.w3.org/1999/xhtml" style="display:inline-block;text-align:inherit;text-decoration:inherit;white-space:normal;"><p style="line-height: 120%"><b>What it does: </b></p>Use the data generated, to answer promptly.<br /><br /><b>First implementation:<br /></b><br />Search inside the table for an answer that provides the result. Once it is found, send it to the verifier.</div></div></foreignObject><text x="69" y="96" fill="#000000" text-anchor="middle" font-size="12px" font-family="Helvetica">[Not supported by viewer]</text></switch></g><rect x="490" y="90" width="140" height="200" fill="none" stroke="none" pointer-events="all"/><g transform="translate(491.5,96.5)"><switch><foreignObject style="overflow:visible;" pointer-events="all" width="138" height="166" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; font-size: 12px; font-family: Helvetica; color: rgb(0, 0, 0); line-height: 1.2; vertical-align: top; width: 138px; white-space: nowrap; overflow-wrap: normal; text-align: left;"><div x