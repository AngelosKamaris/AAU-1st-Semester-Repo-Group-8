-clip: padding-box;&#xa;                border: solid transparent;&#xa;                border-radius: 10px;&#xa;            }&#xa;            .geEditor ::-webkit-scrollbar-thumb:hover {&#xa;                background-color: rgba(0, 0, 0, 0.4);&#xa;            }&#xa;            .geTemplate {&#xa;                border: 1px solid transparent;&#xa;                display: inline-block;&#xa;                _display: inline;&#xa;                vertical-align: top;&#xa;                border-radius: 3px;&#xa;                overflow: hidden;&#xa;                font-size: 14pt;&#xa;                cursor: pointer;&#xa;                margin: 5px;&#xa;            }&#xa;            .geFooterContainer div.geSocialFooter a {&#xa;                display: inline;&#xa;                padding: 0px;&#xa;            }&#xa;            .geFooterContainer div.geSocialFooter a img {&#xa;                margin-top: 10px;&#xa;                opacity: 0.5;&#xa;            }&#xa;            .geFooterContainer div.geSocialFooter a img:hover {&#xa;                opacity: 1;&#xa;            }&#xa;            .geFooterContainer &gt; div#geFooter &gt; img {&#xa;                opacity: 0.5;&#xa;                border: 1px solid transparent;&#xa;                cursor: pointer;&#xa;                margin-top: 3px;&#xa;                margin-right: 6px;&#xa;                position: absolute;&#xa;                right: 4px;&#xa;                top: 12px;&#xa;                padding: 1px;&#xa;                cursor: pointer;&#xa;            }&#xa;            .geFooterContainer &gt; div#geFooter &gt; img:hover {&#xa;                opacity: 1;&#xa;            }&#xa;        </style><style xmlns="http://www.w3.org/1999/xhtml" type="text/css"></style></defs><g><rect x="0" y="272" width="638" height="317" fill="#ffffff" stroke="#000000" stroke-dasharray="3 3" pointer-events="all"/><g transform="translate(1.5,278.5)"><switch><foreignObject style="overflow:visible;" pointer-events="all" width="133" hei