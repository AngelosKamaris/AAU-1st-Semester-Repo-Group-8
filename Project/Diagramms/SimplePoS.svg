ily: Helvetica; color: rgb(0, 0, 0); line-height: 1.2; vertical-align: top; width: 252px; white-space: nowrap; overflow-wrap: normal; text-align: center;"><div xmlns="http://www.w3.org/1999/xhtml" style="display:inline-block;text-align:inherit;text-decoration:inherit;white-space:normal;"><b style="font-size: 15px">Function:</b> f(x) = rand(x,seed) mod N, where rand = f, x can be any value in range [0,N-1]. Starting range N = 2^8.</div></div></foreignObject><text x="126" y="34" fill="#000000" text-anchor="middle" font-size="15px" font-family="Helvetica">[Not supported by viewer]</text></switch></g><path d="M 365 78.14 L 315.71 78.14 L 315.71 149.57 L 273.51 149.57" fill="none" stroke="#000000" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 268.26 149.57 L 275.26 146.07 L 273.51 149.57 L 275.26 153.07 Z" fill="#000000" stroke="#000000" stroke-miterlimit="10" pointer-events="all"/><g transform="translate(298.5,104.5)"><switch><foreignObject style="overflow:visible;" pointer-events="all" width="34" height="17" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; font-size: 16px; font-family: Helvetica; color: rgb(0, 0, 0); line-height: 1.2; vertical-align: top; white-space: nowrap; text-align: center;"><div xmlns="http://www.w3.org/1999/xhtml" style="display:inline-block;text-align:inherit;text-decoration:inherit;background-color:#ffffff;">uses</div></div></foreignObject><text x="17" y="17" fill="#000000" text-anchor="middle" font-size="16px" font-family="Helvetica">uses</text></switch></g><path d="M 493.86 136.71 L 493.86 178.92" fill="none" stroke="#000000" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 493.86 184.17 L 490.36 177.17 L 493.86 178.92 L 497.36 177.17 Z" fill="#000000" stroke="#000000" stroke-miterlimit="10" pointer-events="all"/><g transform="translate(428.5,152.5)"><switch><foreignObject style="overflow:visible;" pointer-events="all" width="129" height="16" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; font-size: 15px; font-family: Helvetica; color: rgb(0, 0, 0); line-height: 1.2; vertical-align: top; white-space: nowrap; text-align: center;"><div xmlns="http://www.w3.org/1999/xhtml" style="display:inline-block;text-align:inherit;text-decoration:inherit;background-color:#ffffff;">Generates &amp; stores</div></div></foreignObject><text x="65" y="16" fill="#000000" text-anchor="middle" font-size="15px" font-family="Helvetica">Generates &amp; stores</text></switch></g><rect x="365" y="21" width="255" height="115" rx="17.25" ry="17.25" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all"/><g transform="translate(365.5,24.5)"><switch><foreignObject style="overflow:visible;" pointer-events="all" width="252" height="106" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; font-size: 15px; font-family: Helvetica; color: rgb(0, 0, 0); line-height: 1.2; vertical-align: top; width: 252px; white-space: nowrap; overflow-wrap: normal; text-align: center;"><div xmlns="http://www.w3.org/1999/xhtml" style="display:inline-block;text-align:inherit;text-decoration:inherit;white-space:normal;"><b>Plotter: </b>creates an array=ar[N] of f(x) values, where x in range 0 to N-1 and seed the unique number of the plot, which is then stores as a key-value table, with f(x) being the key and x being the value</div></div></foreignObject><text x="126" y="61" fill="#000000" text-anchor="middle" font-size="15px" font-family="Helvetica">[Not supported by viewer]</text></switch></g><rect x="8.5" y="314" width="258" height="265" rx="38.7" ry="38.7" fill="#ffe6cc" stroke="#d79b00" pointer-events="all"/><g transform="translate(9.5,347.5)"><switch><foreignObject style="overflow:visible;" pointer-events="all" width="255" height="196" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; font-size: 15px; font-family: Helvetica; color: rgb(0, 0, 0); line-height: 1.2; vertical-align: top; width: 255px; white-space: nowrap; overflow-wrap: normal; text-align: left;"><div xmlns="http://www.w3.org/1999/xhtml" style="display:inline-block;text-align:inherit;text-decoration:inherit;white-space:normal;"><b>Verifier: <br /><br />Issue Challenge: </b>Generate a challenge for a random y=f(x), wait to listen for an answer.<br /><br /><br /><br /><b>Verify answer</b>: See that the answer provided, matches his seed and resolves to the challenge f(ans)=y</div></div></foreignObject><text x="128" y="106" fill="#000000" text-anchor="middle" font-size="15px" font-family="Helvetica">[Not supported by viewer]</text></switch></g><path d="M 459.5 201.5 C 459.5 180.17 525.5 180.17 525.5 201.5 L 525.5 247.5 C 525.5 268.83 459.5 268.83 459.5 247.5 Z" fill="#ffffff" stroke="#000000" stroke-miterlimit="10" pointer-events="all"/><path d="M 459.5 201.5 C 459.5 217.5 525.5 217.5 525.5 201.5" fill="none" stroke="#000000" stroke-miterlimit="10" pointer-events="all"/><g transform="translate(462.5,217.5)"><switch><foreignObject style="overflow:visible;" pointer-events="all" width="57" height="34" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; font-size: 15px; font-family: Helvetica; color: rgb(0, 0, 0); line-height: 1.2; vertical-align: top; width: 58px; white-space: nowrap; overflow-wrap: normal; text-align: center;"><div xmlns="http://www.w3.org/1999/xhtml" style="display:inline-block;text-align:inherit;text-decoration:inherit;white-space:normal;">Array of <br />f(x) : x</div></div></foreignObject><text x="29" y="25" fill="#000000" text-anchor="middle" font-size="15px" font-family="Helvetica">[Not supported by viewer]</text></switch></g><path d="M 470 355.29 L 470 309.57 L 492.86 309.57 L