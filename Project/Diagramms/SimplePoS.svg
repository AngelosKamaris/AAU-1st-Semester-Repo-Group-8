lay: inline-block; font-size: 15px; font-family: Helvetica; color: rgb(0, 0, 0); line-height: 1.2; vertical-align: top; width: 251px; white-space: nowrap; overflow-wrap: normal; text-align: center;"><div xmlns="http://www.w3.org/1999/xhtml" style="display:inline-block;text-align:inherit;text-decoration:inherit;white-space:normal;"><b style="font-size: 15px">Challenge:</b> f(x) = rand(x,seed) mod N, where rand = f, x can be any value in range [0,N-1]. Starting range N = 2^8.</div></div></foreignObject><text x="126" y="43" fill="#000000" text-anchor="middle" font-size="15px" font-family="Helvetica">[Not supported by viewer]</text></switch></g><path d="M 365 79 L 316 79 L 316 150 L 273.37 150" fill="none" stroke="#000000" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 268.12 150 L 275.12 146.5 L 273.37 150 L 275.12 153.5 Z" fill="#000000" stroke="#000000" stroke-miterlimit="10" pointer-events="all"/><g transform="translate(298.5,106.5)"><switch><foreignObject style="overflow:visible;" pointer-events="all" width="34" height="17" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; font-size: 16px; font-family: Helvetica; color: rgb(0, 0, 0); line-height: 1.2; vertical-align: top; white-space: nowrap; text-align: center;"><div xmlns="http://www.w3.org/1999/xhtml" style="display:inline-block;text-align:inherit;text-decoration:inherit;background-color:#ffffff;">uses</div></div></foreignObject><text x="17" y="17" fill="#000000" text-anchor="middle" font-size="16px" font-family="Helvetica">uses</text></switch></g><path d="M 493.86 136.71 L 493.86 178.92" fill="none" stroke="#000000" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 493.86 184.17 L 490.36 177.17 L 493.86 178.92 L 497.36 177.17 Z" fill="#000000" stroke="#000000" stroke-miterlimit="10" pointer-events="all"/><g transform="translate(428.5,152.5)"><switch><foreignObject style="overflow:visible;" pointer-even