ight="63" fill="none" stroke="none" pointer-events="all"/><g transform="translate(249.5,239.5)"><switch><foreignObject style="overflow:visible;" pointer-events="all" width="312" height="56" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; font-size: 12px; font-family: Helvetica; color: rgb(0, 0, 0); line-height: 1.2; vertical-align: top; width: 312px; white-space: nowrap; overflow-wrap: normal; text-align: center;"><div xmlns="http://www.w3.org/1999/xhtml" style="display:inline-block;text-align:inherit;text-decoration:inherit;white-space:normal;">The verifier issues a challenge. The prover must answer it using the stored file. A prover that stores substantially less data should have to perform additional computation to answer challenges.</div></div></foreignObject><text x="156" y="34" fill="#000000" text-anchor="middle" font-size="12px" font-family="Helvetica">[Not supported by viewer]</text></switch></g></g></svg>