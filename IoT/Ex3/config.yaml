#1.1 is covered by all of this

###################1.2########################
networks:
  zone_a_net:
    internal: true                        #1.3
    ipam:
      config:
        - subnet: 1.1.2.0/24 # Zone A
  zone_b_net:
    internal: true                        #1.3
    ipam:
      config:
        - subnet: 1.1.3.0/24 # Zone B

  backbone_net:
    name: backbone_net
    ipam:
      config:
        - subnet: 1.1.1.0/24

  mgmt_net:
    name: mgmt_net
    ipam:
      config:
        - subnet: 1.1.4.0/24
#########################################


services:

#cameras

  camera-1:
    build:
      context: ./
    container_name: camera-1
    environment:
      CAMERA_ID: camera-1
      FOG_URL: http://1.1.2.2:8000    #communicates with fog_a  on zone a
    networks:
      zone_a_net:
        ipv4_address: 1.1.2.3
    depends_on:
      - fog_a
  camera-2:
    build:
      context: ./
    container_name: camera-2
    environment:
      CAMERA_ID: camera-2
      FOG_URL: http://1.1.2.2:8000    #communicates with fog_a on zone a
    networks:
      zone_a_net:
        ipv4_address: 1.1.2.4
    depends_on:
      - fog_a
  camera-3:
    build:
      context: ./
    container_name: camera-3
    environment:
      CAMERA_ID: camera-3
      FOG_URL: http://1.1.3.2:8000  #communicates with fog_b on zone b
    networks:
      zone_b_net:
        ipv4_address: 1.1.3.3
    depends_on:
      - fog_b

#fog devices
  
  fog_a:
    build:
      context: .
    container_name: fog_a
    ports:
      - "8001:8000"
    networks:
      zone_a_net:
        ipv4_address: 1.1.2.2
      backbone_net:
        ipv4_address: 1.1.1.2
      mgmt_net:
        ipv4_address: 1.1.4.2
    cpus: "0.5"                                     #1.4
    mem_limit: 256m
    cap_add:
      - NET_ADMIN
    command: ["sh", "-c", "tc qdisc replace dev eth0 root netem delay 200ms && exec python /run.py"] #1.5 https://medium.com/@kazushi/simulate-high-latency-network-using-docker-containerand-tc-commands-a3e503ea4307
  fog_b:
    build:
      context: .
    container_name: fog_b
    ports:
      - "8002:8000"
    networks:
      zone_b_net:
        ipv4_address: 1.1.3.2
      backbone_net:
        ipv4_address: 1.1.1.3
      mgmt_net:
        ipv4_address: 1.1.4.3
    cpus: "0.5"                                     #1.4
    mem_limit: 256m
    cap_add:
      - NET_ADMIN
    command: ["sh", "-c", "tc qdisc replace dev eth0 root netem delay 200ms && exec python /run.py"] #1.5

#cloud

  cloud:
    build:
      context: .
    container_name: cloud
    ports:
      - "8003:8000"
    networks:
      backbone_net:
        ipv4_address: 1.1.1.4
      mgmt_net:
        ipv4_address: 1.1.4.4
    cap_add:
      - NET_ADMIN
    command: ["sh", "-c", "tc qdisc replace dev eth1 root netem delay 200ms && exec python /run.py"] #1.5 interfaces assign ips in alphabetical order, so eth0 is backbone_net and eth1 is mgmt_net

  logger:
    build:
      context: .
    container_name: logger
    ports:
      - "8004:8000"
    networks:
      mgmt_net:
        ipv4_address: 1.1.4.5